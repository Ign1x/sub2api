# Releases this fork whenever its upstream publishes a release: the upstream tag
# is merged into the default branch, verified, tagged under the same name and
# published by release.yml. Logic lives in .github/release-tools/follow_upstream.sh.
#
# One-time setup:
#   1. Enable Actions on the fork (forks start with workflows disabled).
#   2. Make the maintained branch (upstream release + fork patches) the default
#      branch: `schedule` only runs from the default branch.
#   3. Secret UPSTREAM_SYNC_TOKEN: fine-grained PAT for this repository with
#      Contents and Workflows read/write. Without it the run uses GITHUB_TOKEN,
#      which cannot push a merge that changes .github/workflows.
#   4. Optional repository variables: UPSTREAM_REPO (default ranxi2001/sub2api),
#      SIMPLE_RELEASE=true (amd64 GHCR image only).
name: Follow upstream release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to follow (default: the latest upstream release)'
        required: false
        type: string
      rebuild:
        description: 'Replace an existing release of this tag with the current branch head'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Merge and verify only; push and publish nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: follow-upstream-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'ranxi2001/sub2api' }}
  # Tests of the patches this fork carries; a merge that breaks them is not released.
  FORK_TEST_PATTERN: 'ReplayIdentity|DeidentifyOpenAIResponsesReplay|NonstreamKeepalive'

jobs:
  follow:
    if: github.repository != (vars.UPSTREAM_REPO || 'ranxi2001/sub2api')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Merge, verify, tag and publish
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REBUILD: ${{ inputs.rebuild == true }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          PUSH_TRIGGERS_WORKFLOWS: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          SIMPLE_RELEASE: ${{ vars.SIMPLE_RELEASE == 'true' }}
          VERIFY_CMD: >-
            cd backend &&
            go build -o /dev/null ./cmd/server &&
            go test ./internal/service ./internal/server/... -run "$FORK_TEST_PATTERN" -count=1
        run: bash .github/release-tools/follow_upstream.sh
